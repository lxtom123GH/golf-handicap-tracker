name: Firebase Preview Cleanup

# The hosting project allows 50 preview channels; stale ones make the next
# preview deploy fail "channel quota reached". A PR's preview is only useful
# while the PR is open, so drop its channel once it is merged or closed.
# firebase-preview.yml also sets a 3-day expiry as a backstop.
on:
  pull_request:
    types: [closed]

concurrency:
  group: golf-preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  delete_preview:
    # Fork PRs never get a preview (firebase-preview.yml has the same guard).
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      # The PR's merge ref can be gone once it closes; the script lives on main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Delete this PR's preview channel
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GOLF_HANDICAP_TRACKER_B677C }}
        run: node scripts/delete-pr-preview.mjs ${{ github.event.pull_request.number }}
